<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Amazing's CryNet</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="stylesheet" href="style.css">
<script>
  /* Stamp the theme before first paint: the saved choice, else the OS
   * setting.  app.js keeps it in step afterwards. */
  (function () {
    var t = null;
    try { t = localStorage.getItem('crynet-theme'); } catch (e) { /* private mode */ }
    if (t !== 'light' && t !== 'dark') {
      t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)
        ? 'dark' : 'light';
    }
    document.documentElement.setAttribute('data-theme', t);
  })();
</script>
</head>
<body>
<div class="app">

  <header class="topbar">
    <div class="brand">
      <svg class="brand-logo" viewBox="0 0 32 32" aria-hidden="true">
        <path class="logo-ring" d="M 24.1 6.58 A 11.5 11.5 0 1 0 24.1 25.42"/>
        <path class="logo-peak" d="M 17.5 9 L 11.9 22 M 17.5 9 L 23.1 22"/>
        <circle class="logo-dot" cx="17.5" cy="19" r="2.2"/>
      </svg>Amazing's CryNet
    </div>
    <div class="hubmeta" id="hubmeta" data-state="none">
      <span class="hubmeta-dot" aria-hidden="true"></span><span id="hubmeta-text"></span>
    </div>
    <div class="conn" id="conn" data-state="loading" role="status" aria-live="polite">
      <span class="dot" aria-hidden="true"></span><span id="conn-text">Connecting</span>
    </div>
    <button class="theme-toggle" id="theme" type="button" aria-label="Switch to dark theme">
      <svg class="ico ico-moon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M13.4 9.6A5.6 5.6 0 0 1 6.4 2.6a5.6 5.6 0 1 0 7 7z"/>
      </svg>
      <svg class="ico ico-sun" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="8" cy="8" r="3.1"/>
        <path d="M8 1.4v1.7M8 12.9v1.7M1.4 8h1.7M12.9 8h1.7M3.3 3.3l1.2 1.2M11.5 11.5l1.2 1.2M12.7 3.3l-1.2 1.2M4.5 11.5l-1.2 1.2"/>
      </svg>
    </button>
  </header>

  <nav class="tabs" role="tablist" aria-label="Views">
    <button class="tab" id="tab-overview" role="tab" aria-selected="true" aria-controls="view-overview" type="button">Overview</button>
    <button class="tab" id="tab-patterns" role="tab" aria-selected="false" aria-controls="view-patterns" type="button">Patterns</button>
  </nav>

  <div class="controls">
    <div class="control">
      <span class="control-label" id="range-label">Range</span>
      <div class="segmented" id="range" role="group" aria-labelledby="range-label">
        <button type="button" data-days="7" aria-pressed="false">7 days</button>
        <button type="button" data-days="14" aria-pressed="true">14 days</button>
        <button type="button" data-days="30" aria-pressed="false">30 days</button>
        <button type="button" data-days="90" aria-pressed="false">90 days</button>
      </div>
    </div>
    <div class="control">
      <label for="cot">Cot</label>
      <select id="cot"><option value="0">All cots</option></select>
    </div>
    <div class="control" id="device-control" hidden>
      <label for="device">Hub</label>
      <select id="device"><option value="">All hubs</option></select>
    </div>
  </div>

  <p class="scope-note" id="scope-note" hidden></p>

  <main>
    <section id="view-overview" role="tabpanel" aria-labelledby="tab-overview" tabindex="-1">
      <!-- Who is here.  This strip is deliberately outside #overview-body:
           the body is hidden when there is nothing to show, and "is the
           watcher alive" is the question you ask exactly when there is
           nothing to show. -->
      <div class="presence-strip" id="presence-strip" hidden></div>
      <div class="empty" id="empty-overview" hidden>
        <svg width="72" height="56" viewBox="0 0 72 56" aria-hidden="true">
          <rect x="8" y="22" width="56" height="24" rx="6" fill="none" class="art-line" stroke-width="2"/>
          <path d="M18 22V14M30 22V14M42 22V14M54 22V14" class="art-soft" stroke-width="2" stroke-linecap="round"/>
          <path d="M14 46v6M58 46v6" class="art-line" stroke-width="2" stroke-linecap="round"/>
          <circle cx="36" cy="34" r="4" class="art-dot"/>
        </svg>
        <h2>No records yet</h2>
        <p id="empty-overview-detail">The hub has not reached the dashboard. It keeps every cry in its own flash and uploads it when it can.</p>
      </div>
      <div id="overview-body" hidden>
        <div class="kpis" id="kpis"></div>
        <p class="card-note" id="untimed-note" hidden></p>
        <div class="system-strip" id="system-strip" hidden></div>
        <div class="grid" id="overview-grid"></div>
      </div>
    </section>

    <section id="view-patterns" role="tabpanel" aria-labelledby="tab-patterns" tabindex="-1" hidden>
      <div class="empty" id="empty-patterns" hidden>
        <svg width="72" height="56" viewBox="0 0 72 56" aria-hidden="true">
          <path d="M10 42h52" class="art-line" stroke-width="2" stroke-linecap="round"/>
          <path d="M18 42V30M30 42V34M42 42V26M54 42V36" class="art-soft" stroke-width="4" stroke-linecap="round"/>
        </svg>
        <h2>No patterns yet</h2>
        <p>Durations, nights and gaps appear once the hub has uploaded a few episodes.</p>
      </div>
      <div id="patterns-body" hidden>
        <p class="scope-note" id="patterns-scope" hidden></p>
        <div class="grid" id="patterns-grid"></div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <span id="footer-range"></span>
    <span id="footer-updated"></span>
    <span>Times are shown in this device's own time zone.</span>
  </footer>
</div>

<div class="tooltip" id="tooltip" role="tooltip" hidden></div>

<script src="app.js"></script>
<!-- Cloudflare Web Analytics -->
<script type='module' src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "ee68f0c1fea9487c87a42d6d5dfcf5a1"}'></script>
<!-- End Cloudflare Web Analytics -->
</body>
</html>
